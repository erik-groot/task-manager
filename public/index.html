<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Task Manager</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div id="error" class="notice" role="alert" hidden></div>
  <main id="login-view" class="login" hidden>
    <img src="/icon.svg" width="48" height="48" alt="">
    <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
    <h1>A little more focus.</h1>
    <p>Sign in to your shared task list.</p>
    <form id="login-form">
      <label for="password">Passphrase</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
  <div id="app-view" class="shell" hidden>
    <aside>
      <a href="/" class="brand"><img src="/icon.svg" width="32" height="32" alt=""> Task Manager</a>
      <div class="workspace-label">WORKSPACE</div>
      <nav aria-label="Task views">
        <button data-filter="active" class="selected" aria-pressed="true"><span>○ &nbsp; My tasks</span><span id="active-count" class="count">0</span></button>
        <button data-filter="today" aria-pressed="false"><span>◷ &nbsp; Today</span><span id="today-count" class="count">0</span></button>
        <button data-filter="completed" aria-pressed="false"><span>✓ &nbsp; Completed</span><span id="done-count" class="count">0</span></button>
      </nav>
      <div class="aside-bottom"><p>One list.<br>All your devices.</p><button id="logout" class="quiet" hidden>Sign out</button></div>
    </aside>
    <main class="content">
      <header><div><p class="eyebrow" id="today-label"></p><h1 id="view-title">My tasks</h1><p class="subtitle" id="view-description">Make room for what matters.</p></div><button id="new-task" class="primary">＋ New task</button></header>
      <div class="toolbar"><label class="search-label" for="search">Search tasks</label><input id="search" type="search" placeholder="Search your tasks…" autocomplete="off"><span id="result-count" aria-live="polite"></span></div>
      <section id="task-list" class="task-list" aria-label="Tasks"></section>
      <div id="empty" class="empty" hidden><span class="empty-mark">✓</span><h2 id="empty-title">A clear space to start.</h2><p id="empty-description">Add a task and take it one step at a time.</p></div>
      <footer><span id="sync-status" role="status">Connecting…</span><button id="refresh" class="quiet">Refresh</button></footer>
    </main>
  </div>
  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-heading"><h2 id="dialog-title">New task</h2><button id="close-dialog" type="button" class="icon-button" aria-label="Close">×</button></div>
      <p id="dialog-error" class="dialog-error" role="alert" hidden></p>
      <label for="task-title">What needs doing?</label>
      <input id="task-title" name="title" maxlength="200" placeholder="Give your task a name" required>
      <label for="task-notes">Notes <span class="optional">(optional)</span></label>
      <textarea id="task-notes" name="notes" rows="4" maxlength="4000" placeholder="A few helpful details…"></textarea>
      <div class="form-row"><div><label for="task-due">Due date</label><input id="task-due" name="dueDate" type="date"></div><div><label for="task-priority">Priority</label><select id="task-priority" name="priority"><option value="normal">Normal</option><option value="high">High</option></select></div></div>
      <div class="dialog-actions"><button type="button" id="delete-task" class="danger" hidden>Delete task</button><button type="submit" class="primary">Save task</button></div>
    </form>
  </dialog>
</body>
</html>
